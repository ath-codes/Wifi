name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WifiQuality-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/*.apk
